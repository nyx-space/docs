name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: sh tasker.sh build
      # Pin Node to avoid the keep-alive socket regression in Node 22.23.0 /
      # 24.17.0 (nodejs/node#63989), which makes firebase-tools fail channel
      # deploys with "premature close" -> retried release -> FAILED_PRECONDITION.
      - name: Pin Node for Firebase deploy
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NYX_SPACE }}'
          projectId: nyx-space
